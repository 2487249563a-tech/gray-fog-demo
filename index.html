 {toast:"心契进度出现了。"}]},
{id:"s06",name:"木屋",lines:[
 {img:"b03_cabin_door"},"旁：护林站的木屋，门轴冻住了。他用肩膀撞开。",{img:"b04_cabin_fire"},"旁：他生了火，把你的鞋摆在火边烤，鞋尖朝外。","高：睡吧。我守着。","旁：你睡着了。","旁：半夜你醒过来，火小了。",
 {img:"b05_cabin_write"},"旁：他背对着你坐在火边，膝盖上摊着一个旧本子。",{img:"b06_diary_desk"},"旁：他写一行，停一下。他的左手心里透出一点很淡的暖黄的亮。每写完一行，那点亮就暗一点。",
 {set:{light:60}},{toast:"他身上的未知力量少了一截。（记住你的代价）"},"你：……你在写什么？","旁：他合上本子的动作很快，快得像怕被看见。然后又慢慢把手放松下来。","高：记东西。","高：……怕忘。","你：记什么？","高：（停了很久）……路。","旁：他在撒谎。你不知道自己是怎么知道的。","你：我们以前——是什么关系？","高(担心)：……","高：你想起来的时候，自己会知道。",
 {choice:[
  {t:"追问：“我现在就想知道。”",set:{c1:"ask",light:58},lines:["高：……我们是在一次徒步活动上认识的。你掉了队。我去找的你。","高：就这些。别的，等你自己。","旁：他说完这句，手心的亮又暗了一格。像是说出口，也要花力气。","旁：窗外的雾，往木屋这边挪了一点。你没注意到。"]},
  {t:"不问：“……那我等。”",set:{c1:"wait"},add:{bond:1},lines:["高(微笑)：……嗯。","旁：他把唯一的睡袋拉开，盖到你身上，自己挨着墙坐下。"]}]},
 "旁：火又旺了一点。你听见他翻开本子，很轻地写了两个字。你猜那是你的名字。"]},
{id:"s07",name:"插曲·他的视角",lines:[
 {title:"插曲·他的视角"},{img:"b07_map_circle"},"旁：你睡着以后。","旁：他翻开地图。南坡那块大石头的位置，有一个用铅笔画的圈。",{img:"b08_map_prop"},"旁：他看了很久，用拇指把那个圈擦掉了。","独：别带他去。","独：……让他自己，再选一次。"]},
{id:"s08",name:"这段并肩走",lines:[
 {img:"b09_slope"},"旁：一段向下的坡，整片结了冰。","旁：他摘下一只手套，朝你伸手。","高：这段结冰。","高：……这段并肩走。","旁：他的手很烫。",{toast:"可以牵手了。（心契进度 5）"}]},
{id:"s09",name:"约会·山顶看云",lines:[
 {img:"b10_summit"},"高：上来。……手给我。","旁：雪停了。云在脚下，像另一片雪地。",
 {date:[["力量：帮他把绳子盘好","高：……手法挺熟。"],["学识：问他云为什么在下面","高：我们比它高。……就这么简单。"],["资产：分他半块巧克力","高(害羞)：……甜的。"],["处世：什么都不说，陪他坐着","高：……你以前也是这样。不说话，就坐着。"]]},
 {choice:[{t:"“你常来山里吗？”",lines:["高：……以前常来。和——","旁：他停住了。","高：……常来。"]},{t:"“这里真安静。”",lines:["高：嗯。雾上不来。"]}]},
 "高：出了山……带你去南坡看日出。",
 {choice:[{t:"“好。”",lines:["高(微笑)：……嗯。"]},{t:"“拉钩。”",lines:["旁：他犹豫了一下，伸出小拇指。"]}]},
 {add:{bond:1}},{toast:"约定「南坡日出」——还没去"}]},
{id:"s10",name:"第一位神使",lines:[
 {bg:"b11_pass_dusk",sp:1},{npc:"npc_envoy"},"旁：最后一击，你们一起把它打散了。","旁：雾散开之前，那个声音贴着地面爬过来。","神：……找到你了。","旁：它转向他。灰色的眼睛眯了一下，像闻到了什么。","神：这股力量……你是神灵的代行者？","旁：他愣住了，答不上来。",
 {if:"c1=ask",lines:["神：他跟你讲过什么吧？……我闻到了。","旁：他的脸色变了。"]},"神：他还记得你。……他记不了多久。","旁：雾散了。",{npc:null}]},
{id:"s11",name:"险胜·手还记得",lines:[
 {img:"b12_kneel_snow"},"旁：他单膝跪在雪里。冲锋衣被撕开，左肩全是血。",{set:{light:35,form:"B"}},{toast:"解锁形态②：受伤"},"你：别动！",
 {img:"b13_bandage"},"旁：你跪下去，撕开他的袖子，按住伤口，从他背包里翻出绷带，绕、压、打结。","旁：一气呵成。你自己都愣住了。","高(受伤)：……嘶。","高(微笑)：……手还记得。",
 {flash:"b14_seed1_flash",cap:"半个画面：一间很小的屋子，你给一个人的手指贴创可贴，那人说“轻点”。"},{set:{mem:2}},{item:"手还记得"},
 "你：它问你，是不是神灵的代行者。……什么意思？","高(担心)：……我不知道。","高：我只知道，一年前那天以后，雾就怕我。","高：……先下山。"]},
{id:"s12",name:"回城·锁门",lines:[
 {img:"b15_city_night"},"旁：澜城照常亮着灯。只有你们看得见，每个路人脚边都缠着一缕灰雾。",{img:"b16_entrance"},"旁：你家。浴室里有两支牙刷，橱柜里有两个杯子。门口两双拖鞋，其中一双大得你穿不了。","旁：他在门口换鞋，动作熟得像做过一千次。然后停住了，有点不好意思。","高(害羞)：……我们住一起。","高：你要是不习惯，我睡沙发。",
 {img:"b17_door_lock"},"旁：夜里，你锁上了卧室的门。","旁：你听见他在门外站了一会儿。他没有敲门。",{toast:"你们之间那根绳，松了一些。"}]},
{id:"s13",name:"门口的水",chapter:"第二轮「日记」",lines:[
 {img:"c01_door_inside"},"旁：早上你开门，门口地上放着一杯温水，杯把朝着门。","旁：沙发上的毯子叠好了。他已经出门买早饭了。",
 {if:"c1=ask",lines:["旁：你想起木屋那一夜，他说过一件你们以前的事。……是什么来着？你只记得自己问过，记不得他答了什么。","旁：那一段，像被人从纸上擦掉了。"]}]},
{id:"s14",name:"修鞋铺",lines:[
 {img:"c02_cobbler_closed"},"旁：楼下修鞋铺的卷帘门锈死了。招牌上的字掉得只剩一个“修”。","旁：你多看了一眼，不知道为什么。","旁：隔壁早点摊的阿姨在收蒸笼。你问她，修鞋的师傅去哪了。","姨：（愣了一下）这儿？一直空着啊。","旁：他站在你旁边，也看着那扇门，什么都没说。",{set:{cobbler:1}}]},
{id:"s15",name:"日记",lines:[
 {set:{form:"G"}},{toast:"解锁形态③：城市"},{img:"c03_sofa_sleep"},"旁：他换下了冲锋衣，穿上一件家里的旧衬衫。肩上的绷带从领口露出一角。","旁：午后，他在沙发上睡着了，一只手还压在那个旧本子上。","旁：你轻轻把本子抽了出来。",
 {img:"c04_diary_p1"},"旁：一页一天，写的全是你。","旁：“他咖啡不加糖。”“他怕打雷。打雷那天要开着灯睡。”“他笑的时候先眯左眼。”","旁：有一行写着：“他走夜路，我都说‘我在后面’。”",
 {img:"c05_diary_typo"},"旁：你看见一个错别字。“在”写成了“再”。","旁：你下意识从桌上拿起笔，把它改了。","旁：——然后停住了。","旁：下一行写着：“他会改我的错字。”",
 {img:"c06_diary_fading"},"旁：越往前翻，墨迹越淡。最早的几页，淡得像被雾舔过。","旁：一个陌生人，把你写满了一整本。他是谁？你又是谁？",{toast:"目标：弄清楚他是谁"},"旁：本子最后夹着一张小票：「方记户外」，冲锋衣清洗一次。他还睡着。你拿起外套出了门。"]},
{id:"s16",name:"方记户外",lines:[
 {img:"c07_fangji_shop"},"旁：一家很小的户外店。一整面墙上贴满了登山的签到卡，像鳞片。",{img:"c08_fangji_counter"},"方：欢迎——","方：（看了你好一会儿）……哎？你是那个，那个……","方：老高家的！对，你是跟老高一块儿的！你俩每年第一场雪都——","旁：她停住了。笑容还在脸上，眼睛里的东西先走了。","方：……你是来买什么的？","你：我……想看看那面墙。","方：随便看。都是群里的山友，签了名的，上过山的。",
 {img:"c09_signwall_faded"},"旁：你在墙上找到了一张卡。上面两个名字，左边写着“高岩”，字迹很重。","旁：右边那个名字，淡得几乎看不清了。","旁：你伸手去摸，指尖碰到的地方，一笔一笔，是你的字。",
 {flash:"c10_south_slope_flash",cap:"半个画面：山顶的风，有人在你耳边喊“签这儿，签我旁边”。"},{set:{mem:4}},{item:"签到卡"},"方：（在柜台后面）怪了……我好像有个事要跟老高说。……想不起来了。"]},
{id:"s17",name:"他没问",lines:[
 {img:"c11_sofa_notebook"},"旁：你回到家。他醒了，坐在沙发上，本子摊在膝盖上，停在被你改过的那一页。","旁：他没问你去了哪里。","高：……吃饭吧。"]},
{id:"s18",name:"约会·包饺子",lines:[
 {img:"c12_kitchen"},"旁：他买了面粉、韭菜和一斤肉。说是“顺路”。",{img:"c13_dumpling_date"},
 {date:[["力量：擀皮","高：……皮厚了。没事，我爱吃厚的。"],["学识：调馅","高：盐少放。……你以前总放多。"],["资产：去楼下多买一瓶醋","高(微笑)：……就知道你要醋。"],["处世：包一个硬币进去","高：……你又包硬币。（他自己愣了一下“又”字，低头继续捏饺子）"]]},
 {choice:[{t:"“你包得真丑。”",lines:["高(得意)：能吃就行。"]},{t:"“你以前也给我包过？”",lines:["高：……嗯。","旁：他把最好看的那个放进你碗里。"]}]},{add:{bond:1}}]},
{id:"s19",name:"楼道",lines:[
 {img:"c14_stair_fog"},"旁：楼梯下面传来很重的脚步声。门外那个声音停了。","旁：雾往楼下退。退过他身边的时候，还是用他的声音，问了他一句。","雾：……你和那位，是什么关系？","旁：雾散了。楼道灯一盏一盏重新亮起来。",
 {img:"c15_stair_arrive"},"旁：他上来了，手里拎着药，额头上一道新划的口子。","高(担心)：{名}——你开门了？","你：没开。","你：它学你说“快”。","你：你从来不说“快”。你只说“我在后面”。","旁：他看着你，像是一下子说不出话来。",
 {set:{light:24}},"旁：他靠着墙，慢慢滑坐到台阶上，喘得很厉害。","旁：你在他旁边蹲下，拿过他手里的药，给他擦额头的伤。","旁：你碰到他的手。比在山里的时候凉。","旁：离得很近。他的呼吸停了一下。",
 {black:1},"旁：你吻了他。","旁：他没有躲。","旁：然后，他停住了。手搭在你肩上，没有推开，也没有再靠近。",{black:0},{img:"c16_stair_lit"},
 "高(担心)：……你还不记得。","高：我不想你是因为……","旁：他没说完。",
 {choice:[
  {t:"“我不需要记得。”",set:{c2:"stay"},add:{bond:2},lines:["旁：他抬起头。","你：我不知道以前的我是怎么喜欢你的。","你：现在这个，是我自己的。","旁：他看了你很久。然后把你按进怀里，抱得很紧，紧得像怕你被雾吹走。","高(心动)：……嗯。"]},
  {t:"退开：“……对不起。”",set:{c2:"step"},add:{bond:1},lines:["旁：你站起来，往楼上走。走到半层，身后有脚步声追上来。","高：{名}。",{img:"c17_stair_below"},"高(害羞)：……不是不想。","旁：他站在下面一级台阶上，比你矮了一点，伸手把你抱住了。"]}]},
 {toast:"可以拥抱了。心契进度第一次超过了他身上的未知力量。"},"旁：你想起来的东西还很少。可你已经知道，你想要的是什么了。",{toast:"目标：保住他"}]},
{id:"s20",name:"插曲·阳台",lines:[
 {title:"插曲·他的视角"},{img:"c18_balcony_night"},{img:"c19_balcony_write"},"旁：你睡着以后，他一个人在阳台上，翻开本子。","旁：他写得很慢。手心那点暖黄的亮，比平时暗得更快。他搓了搓手，又接着写。","独：今天，他先……","旁：他停了笔。想了很久，又接着写。","独：手再凉，这一页也要记住。","旁：写完，他在页角写下一个数字。比昨天那页，少了二。"]},
{id:"s21",name:"便利店",chapter:"第三轮「求证」",lines:[
 {img:"d01_phone_list"},"旁：便利店。他买了一盒最大号的创可贴，又放回去，换了一卷绷带。","旁：排队的时候，你的手机响了一下。是杂志社主编回的邮件，只有一句：“你是哪个部门的？”","旁：你盯着那行字看了很久。","旁：先是方姐。现在是主编。","旁：他站在你身后，什么都没说，把绷带放上了柜台。"]},
{id:"s22",name:"寻人启事",lines:[
 {img:"c02_cobbler_closed"},"旁：楼下修鞋铺门口，放着一把小板凳，上面落满了灰。",{img:"d03_thread"},"旁：你蹲下来，看见卷帘门缝里卡着半截鞋线。蜡黄色的，很旧。",{img:"d02_poster"},"旁：旁边的电线杆上贴着一张寻人启事。被雨泡过，又被风吹干。","旁：照片上那张脸，白成了一片，像被雾漂过。下面的字也快没了，只剩一个姓：孙。",
 {if:"cobbler",lines:["旁：上回早点摊的阿姨说，这儿一直空着。"]},{if:"!cobbler",lines:["姨：（在收摊）修鞋的？这儿一直空着啊。"]},"旁：一直空着的铺子，为什么会有人来找？","旁：你把那半截鞋线抽出来，放进了口袋。",{set:{cobbler:1}}]},
{id:"s23",name:"妈妈家",lines:[
 {img:"d04_mom_door"},"旁：日记里有一个地址，被涂掉了一半。你还是找到了。","旁：开门的女人系着围裙，客客气气地问：“你找谁？”","你：我是……您的儿子。","妈：（笑了，像听了个玩笑）……进来吧，外面冷。吃了没有？",
 {img:"d05_mom_table"},"旁：她做了红烧肉。","妈：我有个儿子……好像是有的。","妈：他带过一个大个子回来吃饭。那孩子盛饭，碗沿总朝着我儿子，筷子架在碗口上。","妈：我儿子就把肥肉都夹给他。","旁：她说着说着停下来，看着你。","妈：……你吃饭的样子，跟我儿子挺像的。","旁：你低头。你正把碗里的肥肉夹到一边。",
 {flash:"d06_bowl_flash",cap:"半个画面：一只大手把碗递过来，碗沿朝着你。"},{set:{mem:6}},{item:"碗沿朝你"},"妈：（送到门口）常来啊。","旁：她已经不记得你刚才说过什么了。","旁：快没有人记得你了。"]},
{id:"s24",name:"插曲·楼下",lines:[
 {title:"插曲·他的视角"},{img:"d07_mom_night"},{img:"d08_lamp_wait"},"旁：单元门口，冷风里。他站了两个小时，没有上楼。","旁：他看着三楼那扇亮着的窗户，摸出本子，写了一行。","独：阿姨也忘了他。","独：现在只剩我了。",
 {img:"d09_lamp_him"},"旁：你下楼的时候，他站在路灯底下，装作刚到。","高：……顺路。","旁：他肩上落了一层霜。"]},
{id:"s25",name:"66，64，61",lines:[
 {img:"d10_night_read"},"旁：那天晚上，你又把日记从头读了一遍。这一次，你用的是编辑的眼睛。","旁：你看出来了：好几处地名被涂掉了，涂得很仔细，再在上面写别的字盖住。","旁：方记户外。妈妈家的地址。南坡那块石头。都是你想起东西的地方。",
 {img:"d11_page_numbers"},"旁：你又把日记翻了一遍。这一次，你只看每一页的右下角。","旁：那个很小的数字。66。64。61。……越往后越小。","你：（把日记推到他面前，指着页角）这是什么？","高：……","高：（看着那个数字，很久）……是我还记得的。关于你的。","高：每天晚上数一遍。数到几，就写几。","你：66，64，61。","你：它在往下掉。","高：……最近的事，我开始记不住了。昨天说过的话，前天去过哪儿。","你：（把手机推过去）我也在被忘掉，对不对？","你：只有你没忘。因为你每天都在写。","高(担心)：……我只是不想忘。","你：那你为什么不告诉我以前的事？你明明都知道。",
 {if:"c1=ask",lines:["高：我讲过一次。木屋那晚。","高：第二天你就不记得了。那天夜里，雾就来了。"]},{if:"c1=wait",lines:["高：……我没讲过。我不敢讲。"]},
 "你：那方姐的店，妈妈家，这些地方你也涂掉了。","高(生气)：你每想起一样，那几天夜里，雾就来得更凶。","高：签到卡那天以后，它学着我的声音来敲门。","高：我怕你还没站稳，它先到了。","你：那南坡呢？","你：南坡那段不危险吧。你连我自己去都拦着。","旁：他张了张嘴。没有声音。他答不上来。","你：你瞒着我受伤，瞒着我你的手越来越凉，还替我决定我什么时候能想起来。","高(生气)：你一下子全想起来，会扛不住。","你：那是我的事！","旁：屋子里很安静。暖气片咔哒响了一声。","高：……是你的事。","高：可你是我的事。","旁：那一晚，你们一个在卧室，一个在沙发，谁都没睡。","旁：卧室的门没锁。",{item:"替他扛（专属牌）"}]},
{id:"s26",name:"番茄面",lines:[
 {bg:"d12_living_day",sp:1},"你：讲一件事给我听。随便什么，一件小事就行。","高：……不行。","你：我想知道，是不是真的。","旁：他看了你很久。","高：……我们第一次一起吃饭，你点的是番茄面。","高：你说太酸。最后还是吃完了。",{img:"d13_hand_fresh"},"旁：你抓过一支笔，在手背上写：番茄面。","旁：他手心那点暖黄的亮，暗了一格。他把手揣进了兜里。",{set:{tomato:1}}]},
{id:"s27",name:"约会·烧烤摊",lines:[

{id:"s29",name:"只差你",lines:[
 {img:"d18_balcony_wide"},"旁：阳台上只剩你们两个。他的伤口又裂开了。",{set:{light:14}},{toast:"邪神的伤：快满了"},"旁：你看着地上那一小堆灰。","旁：你想起那张寻人启事上被漂白的脸。想起早点摊阿姨说，这儿一直空着。","旁：没有人记得孙师傅了。所以他变成了这个。","你：……现在，只差你。","高(受伤)：……","你：雾问你，你和那位是什么关系。","你：那位，是我，对不对。","旁：他很久没有说话。",
 {img:"d21_he_sit"},"高：……一年前，雾缠上我那天。是你抱住我的。","高：有一股暖，从你身上过来。我就活了。","旁：他说得很短，像怕说长了，雾会听见。","你：所以你每天写。数你还记得我多少。","你：你是在拿你自己，记住我。","旁：他没有否认。","你：你还怕什么？","旁：他看着你，很久。然后，他第一次把那句话说出口。","高(受伤)：……以前那个我，手是热的。不会忘事，也不会疼成这样。","高：现在这点暖，是你给的。用一点，少一点。","高：我怕哪天用完了，连你也忘了。","高：也怕你想起来，拿他跟我比。……我比不过他。","高：南坡那块石头，是我跟你说喜欢的地方。你那天点了头。","高：我不想你是因为想起那天点了头，才留下来。","旁：原来南坡不是因为危险。","你：我已经选了你。","你：在想起来之前。",

{id:"s30",name:"他忘了",chapter:"第四轮「记住我」",lines:[
 {img:"e01_fog_tide_stair"},"旁：天亮之前，雾潮淹到了二楼。他一个人挡在楼梯口，挡到手心那点亮再也看不见。",{set:{light:3}},"旁：你们打退了它。回到家，他倒头就睡了。",
 {img:"e02_bedroom_noon"},"旁：中午，他醒了。","旁：他坐在床边看着你。看了很久。",{img:"e03_he_gentle"},"高(微笑)：{小名}。","旁：你的手僵住了。他从来没这么叫过你。","高：我们……刚下山？","高：你怎么在家？今天不是要去南坡吗？我答应过你的。","旁：他记得从前的你。记得南坡，记得那个小名，记得一年前的事。","旁：他不记得雪地里那根绳。不记得木屋，不记得楼道，不记得那个吻。",
 {img:"e04_diary_faded"},"旁：你翻开他的本子。这一个月的页面，墨迹全淡了，淡得只剩下纸的颜色。",{if:"c3=grab",lines:["旁：最前面烧掉的那一角，也带走了你们刚认识的那一年。"]},"旁：那一行还剩一点轮廓：“手再凉，这一页也要记住。”","旁：可他偏偏忘了这一页。","高(担心)：……{小名}？你怎么哭了？","你：……没事。","旁：你说“没事”。原来说这两个字的时候，是这种感觉。"]},
{id:"s31",name:"换你来记",lines:[
 {img:"e05_diary_new_page"},"旁：那天夜里，他睡着以后，你坐在台灯下，翻到本子新的一页。你拿起笔。","旁：“十一月三日。雪。他把绳子递给我，说‘你不自在，就算了’。我自己系上了。”",
 {if:"rope=him",lines:["旁：你把这一句划掉，改成：“他蹲下来，给我打了一个结。”"]},"旁：你一页一页往下写。木屋，溪边，结冰的坡，那半块巧克力，楼道。","旁：你是编辑。你知道怎么把一件事写清楚。这一次，换你来记。","旁：你写，他睡。偶尔他翻个身，叫一声{小名}。","旁：你应一声：“在。”",{toast:"还记得他的人：{名}"}]},

 {img:"e15_awaken"},"旁：你身上的雾，一层一层退干净了。有什么东西在你身体里醒过来，把整片雾推了回去。",{img:"e16_he_look_up"},"旁：你站起来，把他护在身后。","你：以前的你，现在的你，我都记住了。","你：这次换我来记。",{toast:"合击「再选一次」解锁"}]},

/* 单文件视觉小说引擎；不请求远程资源，不使用 module/fetch。 */
const $=id=>document.getElementById(id);
const BGM={}; const SFX={};
function playBgm(name){if(!Object.prototype.hasOwnProperty.call(BGM,name))return;}
function playSfx(name){if(!Object.prototype.hasOwnProperty.call(SFX,name))return;}
const SAVE_KEY='gray-fog-saves-v1',READ_KEY='gray-fog-read-v1',SETTING_KEY='gray-fog-settings-v1';
const volatileStore={};
const storage={get(k){try{return localStorage.getItem(k);}catch(e){return Object.prototype.hasOwnProperty.call(volatileStore,k)?volatileStore[k]:null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){volatileStore[k]=v;}},remove(k){try{localStorage.removeItem(k);}catch(e){}delete volatileStore[k];}};
function parseJSON(s,fallback){try{return s?JSON.parse(s):fallback;}catch(e){return fallback;}}
const defaultSettings={textSpeed:27,autoSpeed:1.5,bgmVolume:50,sfxVolume:65};
let settings=Object.assign({},defaultSettings,parseJSON(storage.get(SETTING_KEY),{}));
let allSaves=parseJSON(storage.get(SAVE_KEY),{});let readSet=new Set(parseJSON(storage.get(READ_KEY),[]));
let state=JSON.parse(JSON.stringify(INIT));let sceneIndex=0,frames=[],visual={picture:'b09_slope',sp:false,npc:null,black:false,expr:'smile'},view={type:'idle'},history=[],playing=false,auto=false,skip=false,typing=false,typedChars=[],typingTimer=null,autoTimer=null,chapterTimer=null,toastTimer=null,holdFrame=null,holdStart=0,holdPointer=null,holdFinished=false,modalKind='',hudOpen=true,activeLayer=0,pictureToken=0,lastPicture='',spFilename='',npcFilename='';
const seenImages=new Map();
const names={'高':'高岩','独':'高岩（独白）','神':'神使','方':'方姐','妈':'妈妈','孙':'老孙','姨':'早点摊阿姨','雾':'雾'};
const expressions={'微笑':'smile','害羞':'shy','心动':'heart','得意':'proud','生气':'angry','担心':'worried','受伤':'hurt'};
function substitute(s){return String(s).replaceAll('{名}',state.name).replaceAll('{小名}',state.nick);}
function parseLine(raw){const pos=raw.indexOf('：');if(pos<0)return{who:'旁',text:substitute(raw),expr:''};const prefix=raw.slice(0,pos),match=prefix.match(/^(.+?)\((.+)\)$/);let who=prefix,expr='';if(match){who=match[1];expr=expressions[match[2]]||'';}return{who,text:substitute(raw.slice(pos+1)),expr};}
function assetURL(key){return './assets/'+key+'.webp';}
function getImage(key){if(!key)return Promise.resolve(null);if(seenImages.has(key))return seenImages.get(key);const promise=new Promise(resolve=>{const im=new Image();im.onload=()=>resolve({url:assetURL(key),w:im.naturalWidth,h:im.naturalHeight});im.onerror=()=>{console.warn('[灰雾] 图片加载失败:',assetURL(key));resolve(null);};im.src=assetURL(key);});seenImages.set(key,promise);return promise;}
function collectSceneImages(sc){const found=new Set();let todo=[...sc.lines];while(todo.length){const it=todo.pop();if(!it||typeof it==='string')continue;for(const key of ['img','bg','flash','npc'])if(typeof it[key]==='string')found.add(it[key]);if(Array.isArray(it.lines))todo.push(...it.lines);if(Array.isArray(it.choice))for(const c of it.choice)if(c.lines)todo.push(...c.lines);}return found;}
function preloadAround(index,amount=2){for(let i=index;i<=Math.min(index+amount,SCENES.length-1);i++)for(const key of collectSceneImages(SCENES[i]))getImage(key);}
function showLoading(on){$('loading').classList.toggle('hidden',!on);}
async function renderPicture(force=false){const key=visual.picture;if(!force&&key===lastPicture)return;lastPicture=key;const token=++pictureToken;showLoading(true);const data=await getImage(key);if(token!==pictureToken)return;showLoading(false);const target=1-activeLayer,el=$('layer'+target),other=$('layer'+activeLayer),main=el.querySelector('.scene-img'),blur=el.querySelector('.blurred');el.classList.remove('active');main.style.animation='none';void main.offsetWidth;main.style.animation='';if(!data){main.removeAttribute('src');main.style.display='none';blur.style.opacity='0';el.style.background='#242830';}else{main.src=data.url;main.style.display='block';const ratio=data.w/data.h;const contain=(ratio<1.25||ratio>2.15);main.style.objectFit=contain?'contain':'cover';blur.style.backgroundImage=contain?`url("${data.url}")`:'none';blur.style.opacity=contain?'1':'0';el.style.background='#222733';}el.classList.add('active');other.classList.remove('active');activeLayer=target;}
async function renderSprite(){const filename=visual.sp?`sp_${state.form}_${visual.expr}`:'';if(!filename){spFilename='';$('spImage').classList.remove('visible');$('spImage').removeAttribute('src');return;}if(filename===spFilename)return;spFilename=filename;const el=$('spImage');el.classList.remove('visible');const data=await getImage(filename);if(spFilename!==filename)return;if(data){el.src=data.url;requestAnimationFrame(()=>el.classList.add('visible'));}else el.removeAttribute('src');}
async function renderNpc(){const filename=visual.npc||'';if(!filename){npcFilename='';$('npcImage').classList.remove('visible');$('npcImage').removeAttribute('src');return;}if(filename===npcFilename)return;npcFilename=filename;const el=$('npcImage');el.classList.remove('visible');const data=await getImage(filename);if(npcFilename!==filename)return;if(data){el.src=data.url;requestAnimationFrame(()=>el.classList.add('visible'));}else el.removeAttribute('src');}
function redrawVisual(force=false){$('blackMask').classList.toggle('on',!!visual.black);renderPicture(force);renderSprite();renderNpc();}
function updateHud(animate=true){for(const [id,value] of [['bondStat',state.bond],['memStat',state.mem+'/10'],['lightStat',state.light],['hudCompact',state.bond]]){const el=$(id);if(el.textContent!==String(value)){el.textContent=value;if(animate){el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse');}}}$('lightBar').style.width=Math.max(0,Math.min(100,Number(state.light)||0))+'%';}
function persistSettings(){storage.set(SETTING_KEY,JSON.stringify(settings));}
function persistRead(){storage.set(READ_KEY,JSON.stringify([...readSet]));}
function snapshot(){return {version:1,sceneIndex,frames:JSON.parse(JSON.stringify(frames)),state:JSON.parse(JSON.stringify(state)),visual:{...visual},view:JSON.parse(JSON.stringify(view)),history:JSON.parse(JSON.stringify(history)),time:Date.now(),sceneName:SCENES[sceneIndex]?.name||'序章完'};}
function persistSaves(){storage.set(SAVE_KEY,JSON.stringify(allSaves));}
function saveSlot(slot){if(!playing)return false;allSaves[slot]=snapshot();persistSaves();refreshContinue();return true;}
function latestSave(){return Object.values(allSaves).filter(x=>x&&x.version===1).sort((a,b)=>b.time-a.time)[0]||null;}
function refreshContinue(){$('continueBtn').disabled=!latestSave();}
function loadSnapshot(data){if(!data||data.version!==1||!Array.isArray(data.frames)||!data.state||!data.visual)return false;stopModes();clearTimers();sceneIndex=data.sceneIndex;frames=JSON.parse(JSON.stringify(data.frames));state=JSON.parse(JSON.stringify(data.state));migrateLevels();visual={...data.visual};view=JSON.parse(JSON.stringify(data.view||{type:'idle'}));history=JSON.parse(JSON.stringify(data.history||[]));lastPicture='';spFilename='';npcFilename='';activeLayer=0;$('layer0').classList.remove('active');$('layer1').classList.remove('active');$('titleScreen').classList.add('hidden');$('game').classList.remove('hidden');playing=true;closeModal();preloadAround(sceneIndex);updateHud(false);redrawVisual(true);if(view.type==='idle')playNext();else renderView(false);return true;}
function clearTimers(){clearInterval(typingTimer);clearTimeout(autoTimer);clearTimeout(chapterTimer);clearTimeout(toastTimer);if(holdFrame!==null)cancelAnimationFrame(holdFrame);typingTimer=autoTimer=chapterTimer=toastTimer=holdFrame=null;typing=false;}
function stopModes(){auto=false;skip=false;$('autoBtn').classList.remove('active');$('skipBtn').classList.remove('active');clearTimeout(autoTimer);}
function showToast(text){levelToast(text);$('toast').textContent=substitute(text);$('toast').classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('on'),2500);}
function testCondition(expr){const eq=expr.indexOf('=');if(eq>=0)return String(state[expr.slice(0,eq)])===expr.slice(eq+1);if(expr.startsWith('!'))return !state[expr.slice(1)];return !!state[expr];}
function applySet(o){if(!o)return;Object.assign(state,o);updateHud();if(Object.prototype.hasOwnProperty.call(o,'form'))renderSprite();}
function applyAdd(o){if(!o)return;for(const [k,v] of Object.entries(o))state[k]=(Number(state[k])||0)+Number(v);updateHud();}
function startNew(name){clearTimers();stopModes();state=JSON.parse(JSON.stringify(INIT));state.name=(name||'').trim().slice(0,24)||'林川';state.nick='宝贝';campaign();$('battleScreen').classList.add('hidden');$('game').classList.remove('in-battle');history=[];frames=[];visual={picture:'b09_slope',sp:false,npc:null,black:false,expr:'smile'};view={type:'idle'};lastPicture='';spFilename='';npcFilename='';playing=true;$('titleScreen').classList.add('hidden');$('game').classList.remove('hidden');$('endPage').classList.add('hidden');closeModal();updateHud(false);preloadAround(0,1);beginScene(0);}
function beginScene(index){clearTimeout(chapterTimer);if(index>=SCENES.length){showEnding();return;}sceneIndex=index;frames=levelSceneFrames(index);view={type:'idle'};preloadAround(index,2);if(SCENES[index].chapter){view={type:'chapter',text:SCENES[index].chapter};saveSlot('auto');renderView();}else{saveSlot('auto');playNext();}}
function playNext(){if(!playing)return;clearTimeout(autoTimer);clearInterval(typingTimer);typing=false;let guard=0;while(guard++<25000){if(!frames.length){beginScene(sceneIndex+1);return;}const frame=frames[frames.length-1];if(frame.i>=frame.lines.length){frames.pop();continue;}const idx=frame.i++,it=frame.lines[idx],path=frame.path+'/'+idx;if(typeof it==='string'){const parsed=parseLine(it);if((parsed.who==='高'||parsed.who==='独')&&parsed.expr){visual.expr=parsed.expr;renderSprite();}if(skip&&!readSet.has(path))toggleSkip(false);view={type:'dialog',key:path,speaker:parsed.who,text:parsed.text};history.push({who:parsed.who==='旁'?'':speakerName(parsed.who),text:parsed.text});renderView();return;}if(!it||typeof it!=='object')continue;
if(it.battle){startLevel(it.battle);return;}
if(it.battleSummary){stopModes();view={type:'battleComplete',level:'d7'};saveSlot('auto');renderView();return;}
if(Object.prototype.hasOwnProperty.call(it,'if')){if(testCondition(it.if))frames.push({path:path+'/if',lines:it.lines||[],i:0});continue;}
if(Object.prototype.hasOwnProperty.call(it,'set')){applySet(it.set);continue;}
if(Object.prototype.hasOwnProperty.call(it,'add')){applyAdd(it.add);continue;}
if(Object.prototype.hasOwnProperty.call(it,'item')){if(!state.seeds.includes(it.item))state.seeds.push(it.item);levelItem(it.item);showToast('获得：'+it.item);continue;}
if(Object.prototype.hasOwnProperty.call(it,'toast')){showToast(it.toast);continue;}
if(Object.prototype.hasOwnProperty.call(it,'img')){visual.picture=it.img;visual.sp=false;visual.npc=null;redrawVisual();continue;}
if(Object.prototype.hasOwnProperty.call(it,'bg')){visual.picture=it.bg;visual.sp=!!it.sp;redrawVisual();continue;}
if(Object.prototype.hasOwnProperty.call(it,'npc')){visual.npc=it.npc;renderNpc();continue;}
if(Object.prototype.hasOwnProperty.call(it,'black')){visual.black=!!it.black;redrawVisual();continue;}
if(Object.prototype.hasOwnProperty.call(it,'title')){view={type:'title',text:substitute(it.title)};renderView();return;}
if(Object.prototype.hasOwnProperty.call(it,'flash')){view={type:'flash',picture:it.flash,caption:substitute(it.cap||'')};renderView();return;}
if(Object.prototype.hasOwnProperty.call(it,'choice')){view={type:'choice',path,items:it.choice};renderView();return;}
if(Object.prototype.hasOwnProperty.call(it,'date')){view={type:'date',path,items:it.date};renderView();return;}
if(Object.prototype.hasOwnProperty.call(it,'hold')){view={type:'hold',text:substitute(it.hold)};renderView();return;}
if(Object.prototype.hasOwnProperty.call(it,'end')){showEnding();return;}
}console.warn('[灰雾] 指令循环触发上限');}
function speakerName(who){return who==='你'?state.name:(names[who]||who);}
function markRead(){if(view.type==='dialog'&&view.key&&!readSet.has(view.key)){readSet.add(view.key);persistRead();}}
function setTypingDone(){clearInterval(typingTimer);typingTimer=null;typing=false;$('dialogText').textContent=view.text||'';$('nextIndicator').classList.remove('hidden');if(auto&&view.type==='dialog')scheduleAuto();if(skip&&view.type==='dialog')scheduleSkip();}
function startTyping(instant=false){const txt=view.text||'',unit=Array.from(txt);typedChars=unit;$('dialogText').textContent='';$('nextIndicator').classList.add('hidden');typing=false;clearInterval(typingTimer);clearTimeout(autoTimer);if(instant||Number(settings.textSpeed)===0||skip){$('dialogText').textContent=txt;$('nextIndicator').classList.remove('hidden');if(auto)scheduleAuto();if(skip)scheduleSkip();return;}let index=0;typing=true;typingTimer=setInterval(()=>{index=Math.min(unit.length,index+1);$('dialogText').textContent=unit.slice(0,index).join('');if(index>=unit.length)setTypingDone();},Math.max(7,Number(settings.textSpeed)||27));}
function scheduleAuto(){clearTimeout(autoTimer);if(!auto||view.type!=='dialog')return;autoTimer=setTimeout(()=>advance(),Math.round((Number(settings.autoSpeed)||1.5)*1000+Math.min(2300,Array.from(view.text).length*32)));}
function scheduleSkip(){clearTimeout(autoTimer);if(!skip||view.type!=='dialog')return;if(!readSet.has(view.key)){toggleSkip(false);return;}autoTimer=setTimeout(()=>advance(),40);}
function renderView(restore=false){$('dialog').classList.add('hidden');$('centerCard').classList.add('hidden');$('centerCard').classList.remove('flash-card');$('choices').classList.add('hidden');$('holdBox').classList.add('hidden');$('endPage').classList.add('hidden');clearTimeout(chapterTimer);$('flashImage').classList.add('hidden');$('flashCaption').classList.add('hidden');if(renderLevelView())return;if(view.type==='dialog'){$('dialog').classList.remove('hidden');const speaker=view.speaker;if(speaker==='旁'){$('nameplate').classList.add('hidden');}else{$('nameplate').classList.remove('hidden');$('nameplate').textContent=speakerName(speaker);}startTyping(restore||false);}else if(view.type==='title'||view.type==='chapter'){$('centerCard').classList.remove('hidden');$('cardTitle').classList.remove('hidden');$('cardTitle').textContent=view.text;$('cardHint').textContent=view.type==='chapter'?'即将开始 · 点击跳过':'点击继续';if(view.type==='chapter')chapterTimer=setTimeout(()=>{if(view.type==='chapter')advance();},2000);}else if(view.type==='flash'){$('centerCard').classList.remove('hidden');$('centerCard').classList.add('flash-card');$('cardTitle').classList.add('hidden');$('flashImage').classList.remove('hidden');$('flashImage').src=assetURL(view.picture);$('flashCaption').classList.remove('hidden');$('flashCaption').textContent=view.caption;$('cardHint').textContent='点击继续';getImage(view.picture).then(d=>{if(view.type==='flash'&&view.picture&&!d){$('flashImage').removeAttribute('src');}});}else if(view.type==='choice'||view.type==='date'){$('choices').classList.remove('hidden');const box=$('choices');box.replaceChildren();box.dataset.count=String(view.items.length);view.items.forEach((item,n)=>{const btn=document.createElement('button');btn.className='choice-button';btn.textContent=view.type==='date'?item[0]:substitute(item.t);btn.addEventListener('click',(e)=>{e.stopPropagation();selectChoice(n);});box.append(btn);});}else if(view.type==='hold'){$('holdBox').classList.remove('hidden');$('holdLabel').textContent=view.text;$('holdButton').style.setProperty('--progress','0%');$('holdHint').textContent='按住 2 秒';}else if(view.type==='end')showEnding();if(skip&&view.type!=='dialog')toggleSkip(false);}
function selectChoice(n){const current=view;if(!['choice','date'].includes(current.type))return;const item=current.items[n];if(!item)return;let text,extra;if(current.type==='date'){text=item[0];applyAdd({bond:1});extra=String(item[1]).split('｜');}else{text=substitute(item.t);applySet(item.set);applyAdd(item.add);extra=item.lines||[];}history.push({who:'',text:'你选了：'+text,choice:true});frames.push({path:current.path+'/'+(current.type==='date'?'date':'choice')+n,lines:extra,i:0});playNext();}
function advance(){if(!playing||modalKind)return;if(view.type==='dialog'){if(typing){setTypingDone();return;}markRead();playNext();}else if(['chapter','title','flash'].includes(view.type)){clearTimeout(chapterTimer);playNext();}else if(view.type==='idle')playNext();}
function toggleAuto(force){auto=typeof force==='boolean'?force:!auto;if(auto)toggleSkip(false);$('autoBtn').classList.toggle('active',auto);clearTimeout(autoTimer);if(auto&&view.type==='dialog'&&!typing)scheduleAuto();}
function toggleSkip(force){skip=typeof force==='boolean'?force:!skip;if(skip){auto=false;$('autoBtn').classList.remove('active');}$('skipBtn').classList.toggle('active',skip);clearTimeout(autoTimer);if(skip&&view.type==='dialog'){if(readSet.has(view.key)){if(typing)setTypingDone();else scheduleSkip();}else toggleSkip(false);}}
function showEnding(){stopModes();view={type:'end'};$('endPage').classList.remove('hidden');$('dialog').classList.add('hidden');$('choices').classList.add('hidden');$('centerCard').classList.add('hidden');$('holdBox').classList.add('hidden');$('endStats').innerHTML=`<span>♥ 心契 ${state.bond}</span><span>记忆 ${state.mem}/10</span><span>未知力量 ${state.light}</span>`;$('endSeeds').textContent=state.seeds.length?state.seeds.join('、'):'尚无';const summary=[['系绳',state.rope==='self'?'自己系':state.rope==='him'?'他帮我系':'未选择'],['木屋',state.c1==='ask'?'追问':state.c1==='wait'?'不问':'未选择'],['楼道',state.c2==='stay'?'我不需要记得':state.c2==='step'?'退开':'未选择'],['老孙',state.c3==='name'?'喊名字':state.c3==='grab'?'抢夺':'未选择']];$('endReview').replaceChildren();summary.forEach(([k,v])=>{const p=document.createElement('p');p.textContent=k+'：'+v;$('endReview').append(p);});}
function returnTitle(){clearTimers();stopModes();closeModal();playing=false;$('titleScreen').classList.remove('hidden');$('game').classList.add('hidden');refreshContinue();}
function openModal(kind){modalKind=kind;clearTimeout(autoTimer);renderModal();$('modalWrap').classList.remove('hidden');}
function closeModal(){modalKind='';$('modalWrap').classList.add('hidden');if(auto&&view.type==='dialog'&&!typing)scheduleAuto();}
function makeBtn(label,handler,cls='secondary'){const b=document.createElement('button');b.className=cls;b.textContent=label;b.addEventListener('click',handler);return b;}
function renderModal(){const m=$('modalPanel');m.replaceChildren();const header=document.createElement('div');header.className='modal-head';const h=document.createElement('h2');const labels={name:'你的名字',saves:'存档／读档',settings:'设置',menu:'菜单',log:'剧情回看',reset:'重置全部存档'};h.textContent=labels[modalKind]||'';header.append(h,makeBtn('关闭 ✕',closeModal,'icon-btn'));m.append(header);
if(modalKind==='name'){const p=document.createElement('p');p.textContent='你想让高岩怎样称呼你？（小名固定为“宝贝”）';m.append(p);const input=document.createElement('input');input.type='text';input.placeholder='林川';input.value='林川';input.maxLength=24;input.id='playerNameInput';m.append(input,makeBtn('走进灰雾',()=>startNew(input.value),'primary'));return;}
if(modalKind==='menu'){const stack=document.createElement('div');stack.className='stack';stack.append(makeBtn('继续游戏',closeModal),makeBtn('设置',()=>openModal('settings')),makeBtn('回到标题',()=>returnTitle()));m.append(stack);return;}
if(modalKind==='log'){const box=document.createElement('div');box.id='logScroll';if(!history.length){const p=document.createElement('p');p.textContent='还没有对话。';box.append(p);}for(const h of history){const row=document.createElement('div');row.className='log-row';if(h.who){const n=document.createElement('span');n.className='log-name';n.textContent=h.who;row.append(n);}const txt=document.createElement('span');txt.className=h.choice?'log-choice':'';txt.textContent=h.text;row.append(txt);box.append(row);}m.append(box);requestAnimationFrame(()=>box.scrollTop=box.scrollHeight);return;}
if(modalKind==='saves'){const hint=document.createElement('p');hint.textContent='手动存档 3 格；剧情场景起点及每次战斗操作自动存档。读档将恢复画面、状态、进度和回看。';m.append(hint);for(const key of ['auto','s1','s2','s3']){const data=allSaves[key],row=document.createElement('div');row.className='slot';const desc=document.createElement('div');desc.className='slot-desc';const name=document.createElement('span');name.className='slot-name';name.textContent=(key==='auto'?'自动档':`手动档 ${key.slice(1)}`)+' · '+(data?.sceneName||'空');const date=document.createElement('span');date.className='slot-time';date.textContent=data?new Date(data.time).toLocaleString('zh-CN'):'未保存';desc.append(name,date);const buttons=document.createElement('div');buttons.style.display='flex';buttons.style.gap='4px';if(key!=='auto'&&playing)buttons.append(makeBtn('存',()=>{saveSlot(key);renderModal();}));if(data)buttons.append(makeBtn('读',()=>loadSnapshot(data)));row.append(desc,buttons);m.append(row);}return;}
if(modalKind==='settings'){const fields=[['textSpeed','文字速度（0 为关闭打字机）',0,90,1],['autoSpeed','自动播放停留时间（秒）',.5,4,.1],['bgmVolume','BGM 音量（暂无音频）',0,100,1],['sfxVolume','音效音量（暂无音频）',0,100,1]];for(const [k,title,min,max,step] of fields){const l=document.createElement('label');const value=document.createElement('span');value.textContent=String(settings[k]);const slider=document.createElement('input');slider.type='range';slider.min=min;slider.max=max;slider.step=step;slider.value=settings[k];slider.id='setting-'+k;slider.addEventListener('input',()=>{settings[k]=Number(slider.value);value.textContent=slider.value;persistSettings();});l.append(document.createTextNode(title+'：'),value,slider);m.append(l);}const row=document.createElement('div');row.className='row-actions';row.append(makeBtn('重置所有存档',()=>openModal('reset')),makeBtn('完成',closeModal,'primary'));m.append(row);return;}
if(modalKind==='reset'){const p=document.createElement('p');p.textContent='此操作将删除自动档、3 个手动档与已读记录，不能撤销。';m.append(p);const b=makeBtn('第一次确认：我要重置',()=>{b.textContent='第二次确认：永久删除';b.className='primary';b.onclick=()=>{allSaves={};readSet.clear();storage.remove(SAVE_KEY);storage.remove(READ_KEY);refreshContinue();openModal('settings');showToast('所有存档已重置');};});m.append(b);return;}}
function holdProgress(now){if(view.type!=='hold'||holdPointer===null)return;const fraction=Math.min(1,(now-holdStart)/2000);$('holdButton').style.setProperty('--progress',(fraction*100)+'%');if(fraction>=1){completeHold();return;}holdFrame=requestAnimationFrame(holdProgress);}
function beginHold(e){if(view.type!=='hold'||holdPointer!==null)return;e.preventDefault();holdPointer=e.pointerId;holdStart=performance.now();holdFinished=false;try{$('holdButton').setPointerCapture(e.pointerId);}catch(_){}holdFrame=requestAnimationFrame(holdProgress);}
function cancelHold(e){if(holdPointer===null||e.pointerId!==holdPointer)return;holdPointer=null;if(holdFrame!==null)cancelAnimationFrame(holdFrame);holdFrame=null;$('holdButton').style.setProperty('--progress','0%');}
function completeHold(){if(view.type!=='hold')return;holdFinished=true;holdPointer=null;if(holdFrame!==null)cancelAnimationFrame(holdFrame);holdFrame=null;playNext();}
$('holdButton').addEventListener('pointerdown',beginHold);$('holdButton').addEventListener('pointerup',cancelHold);$('holdButton').addEventListener('pointercancel',cancelHold);$('holdButton').addEventListener('lostpointercapture',cancelHold);$('holdSkip').addEventListener('click',e=>{e.stopPropagation();completeHold();});
$('game').addEventListener('click',e=>{if(e.target.closest('button,input,#controls,#hud,#endPage,#choices,#holdBox'))return;advance();});
$('newGameBtn').addEventListener('click',()=>openModal('name'));$('continueBtn').addEventListener('click',()=>{const save=latestSave();if(save)loadSnapshot(save);});$('titleLoadBtn').addEventListener('click',()=>openModal('saves'));$('titleSettingsBtn').addEventListener('click',()=>openModal('settings'));
$('autoBtn').addEventListener('click',()=>toggleAuto());$('skipBtn').addEventListener('click',()=>toggleSkip());$('logBtn').addEventListener('click',()=>openModal('log'));$('saveBtn').addEventListener('click',()=>openModal('saves'));$('loadBtn').addEventListener('click',()=>openModal('saves'));$('menuBtn').addEventListener('click',()=>openModal('menu'));$('hudToggle').addEventListener('click',()=>{$('hudInner').classList.toggle('hidden',hudOpen);hudOpen=!hudOpen;});$('endAgain').addEventListener('click',()=>openModal('name'));$('endTitle').addEventListener('click',returnTitle);
document.addEventListener('keydown',e=>{if(e.target instanceof HTMLInputElement||modalKind){if(e.key==='Escape'&&modalKind){e.preventDefault();closeModal();}return;}if(!playing)return;const k=e.key;if([' ','Enter','ArrowRight'].includes(k)){e.preventDefault();advance();}else if(k.toLowerCase()==='a'){toggleAuto();}else if(k.toLowerCase()==='s'){toggleSkip();}else if(k.toLowerCase()==='l'){openModal('log');}else if(k==='Escape'){openModal('menu');}});
window.GrayFog={getSnapshot:()=>snapshot(),getReadKeys:()=>[...readSet],getView:()=>({...view}),getSaves:()=>JSON.parse(JSON.stringify(allSaves))};
refreshContinue();preloadAround(0,1);updateHud(false);
